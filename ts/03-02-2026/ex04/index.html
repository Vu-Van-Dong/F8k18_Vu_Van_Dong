		<script>
			
			
			const header=['code','customer','customer','amount','status','Action']
			
			const orders = [
				{ code: '001', customer: 'Tran xuan bang', product: 'laptop', amount: 30000, status: "ok" },
				{ code: '002', customer: 'Tran xuan quang', product: 'ip12', amount: 350000, status: 'ok' }
			]
			
			const renderOrderTable = () => {
				const mainE = document.querySelector('main')
				mainE.innerHTML = '' // tránh render trùng
				
				const tableE = document.createElement('table')
				tableE.border = '1'
				tableE.cellSpacing = '0'
				tableE.width = '100%'
				
				const theadE = document.createElement('thead')
				const tbodyE = document.createElement('tbody')
				
				theadE.innerHTML = `
            <tr>
                <th>Code</th>
                <th>Customer</th>
                <th>Product</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        `
				
				
				
				//sender header v2
				const trHeaderE = document.createElement('tr')
				trHeaderE.forEach(header=>{
					const thE = document.createElement('th')
					thE.textContent=header
					trHeaderE.append(thE)
				})
				
				theadE.append(trHeaderE)
				
				
				orders.forEach(order => {
					const trE = document.createElement('tr')
					trE.innerHTML = `
                <td>${order.code}</td>
                <td>${order.customer}</td>
                <td>${order.product}</td>
                <td>${order.amount}</td>
                <td>${order.status}</td>
                <td>
                    <button>Edit</button>
                    <button>Delete</button>
                </td>
            `
					tbodyE.append(trE)
				})
				
				tableE.append(theadE, tbodyE)
				mainE.append(tableE)
			}
			
			renderOrderTable()
